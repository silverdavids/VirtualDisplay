services:
  virtual-display:
    build:
      context: .
      args:
        REACT_APP_TERMINAL_CODE: ${REACT_APP_TERMINAL_CODE:-}
        REACT_APP_DISPLAY_VERSION: ${REACT_APP_DISPLAY_VERSION:-1.0.0}
    environment:
      VIRTUAL_API_BASE_URL: ${VIRTUAL_API_BASE_URL:-}
      VIRTUAL_TICKETS_API: ${VIRTUAL_TICKETS_API:-}
    ports:
      - "${DISPLAY_PORT:-3001}:80"
    restart: unless-stopped

